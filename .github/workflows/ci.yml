name: NagrikSetu Skill Development CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Backend CI Job (Python 3.11, Dependencies, Lint/Syntax & Test Suite)
  # =========================================================================
  backend-ci:
    name: Backend CI (Python & FastAPIs)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: skill_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -u root -p${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Disposable Ephemeral CI Credentials
        run: |
          # 1. Ephemeral database user & password for disposable runner container
          DB_USER="ci_user_$(openssl rand -hex 4)"
          DB_PASS="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASS"
          echo "CI_DB_USER=$DB_USER" >> $GITHUB_ENV
          echo "CI_DB_PASS=$DB_PASS" >> $GITHUB_ENV
          echo "DATABASE_URL=mysql+pymysql://${DB_USER}:${DB_PASS}@127.0.0.1:3306/skill_db" >> $GITHUB_ENV

          # 2. Ephemeral JWT Secret (strictly generated fresh per run)
          GEN_JWT="$(openssl rand -hex 32)"
          echo "::add-mask::$GEN_JWT"
          echo "JWT_SECRET=$GEN_JWT" >> $GITHUB_ENV

          # 3. Ephemeral Admin Credentials (strictly generated fresh per run)
          GEN_ADMIN_PASS="$(openssl rand -hex 16)!"
          echo "::add-mask::$GEN_ADMIN_PASS"
          echo "ADMIN_EMAIL=ci-admin-${GITHUB_RUN_ID}@nagriksetu.ci" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=$GEN_ADMIN_PASS" >> $GITHUB_ENV

          # 4. Writable Temporary Upload Directory for Runner
          CI_UPLOAD_DIR="${{ runner.temp }}/nagriksetu-uploads"
          mkdir -p "$CI_UPLOAD_DIR"
          echo "UPLOAD_DIR=$CI_UPLOAD_DIR" >> $GITHUB_ENV

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx flake8

      - name: Python Syntax and Code Quality Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Configure Disposable Database & Initialize Schema
        env:
          MYSQL_ROOT_PWD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        run: |
          # Provision disposable test user using root credentials via environment variable
          MYSQL_PWD="$MYSQL_ROOT_PWD" mysql -h 127.0.0.1 -P 3306 -u root -e "
            CREATE DATABASE IF NOT EXISTS skill_db;
            CREATE USER IF NOT EXISTS '${CI_DB_USER}'@'%' IDENTIFIED BY '${CI_DB_PASS}';
            GRANT ALL PRIVILEGES ON skill_db.* TO '${CI_DB_USER}'@'%';
            FLUSH PRIVILEGES;
          "
          # Restore schema and migrations using the newly provisioned disposable user
          MYSQL_PWD="$CI_DB_PASS" mysql -h 127.0.0.1 -P 3306 -u "$CI_DB_USER" skill_db < database/skill_db_backup.sql
          MYSQL_PWD="$CI_DB_PASS" mysql -h 127.0.0.1 -P 3306 -u "$CI_DB_USER" skill_db < database/ci_schema_migrations.sql

      - name: Run Backend Integration & Functional Tests
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest tests/test_skill_service.py -v --tb=short 2>&1 | tee pytest_output.log

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/pytest_output.log

  # =========================================================================
  # 2. Frontend CI Job (Node.js 20, Typescript Verification & Production Build)
  # =========================================================================
  frontend-ci:
    name: Frontend CI (React 18 & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Check and Production Build
        working-directory: frontend
        run: npm run build

  # =========================================================================
  # 3. Docker CI Job (Docker Compose Validation & Image Builds)
  # =========================================================================
  docker-ci:
    name: Docker CI (Compose Validation & Container Builds)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        env:
          MYSQL_ROOT_PASSWORD: safe-ci-root-pass
          MYSQL_DATABASE: skill_db
          MYSQL_USER: nagriksetu_skill
          MYSQL_PASSWORD: safe-ci-app-pass
          SKILL_DB_PORT: 3308
          JWT_SECRET: safe-ci-jwt-secret-32-chars-long
          ADMIN_EMAIL: skill.admin@nagriksetu.local
          ADMIN_PASSWORD: SafeAdminPassword2026!
          SKILL_BACKEND_PORT: 8003
          SKILL_FRONTEND_PORT: 5173
        run: |
          docker compose -f docker-compose.yml config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: nagriksetu-skill-backend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: nagriksetu-skill-frontend:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 4. Continuous Delivery (CD) Job — Publish Verified Images to GHCR
  # =========================================================================
  cd-ghcr:
    name: Continuous Delivery (GHCR Package Publishing)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Backend Image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Extract Metadata for Frontend Image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and Push Backend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
